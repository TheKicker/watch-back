<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Ohio DOT - US-22 / SR-7 / SR-213 Quad</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background: #0a0a0a;
            color: white;
            font-family: Arial, sans-serif;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        header {
            background: #111;
            padding: 10px 15px;
            text-align: center;
            border-bottom: 3px solid #ffcc00;
            flex-shrink: 0;
        }
        h1 {
            margin: 0;
            font-size: 1.4em;
        }
        p {
            margin: 4px 0 0;
            font-size: 0.95em;
            opacity: 0.9;
        }
        .camera-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            overflow: auto;
            position: relative;
            padding: 8px;
            box-sizing: border-box;
        }
        img {
            max-width: 100%;
            max-height: 100%;
            width: auto;
            height: auto;
            border: 4px solid #ffcc00;
            box-shadow: 0 0 30px rgba(255, 204, 0, 0.6);
            image-rendering: crisp-edges;
            transition: transform 0.2s;
        }
        /* Landscape / Wide screens - prioritize full height */
        @media (orientation: landscape) and (min-width: 600px) {
            img {
                height: 100%;
                width: auto;
            }
        }
        /* Portrait / Phones - prioritize full width */
        @media (orientation: portrait) or (max-width: 599px) {
            img {
                width: 100%;
                height: auto;
            }
            .camera-container {
                padding: 5px;
            }
        }

        .overlay {
            position: absolute;
            bottom: 16px;
            left: 16px;
            background: rgba(0,0,0,0.8);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 0.95em;
            pointer-events: none;
            z-index: 10;
        }
        .timestamp {
            position: absolute;
            bottom: 16px;
            right: 16px;
            background: rgba(0,0,0,0.8);
            padding: 8px 14px;
            border-radius: 6px;
            font-size: 1.05em;
            font-weight: bold;
            z-index: 10;
        }
        footer {
            background: #111;
            padding: 8px;
            text-align: center;
            font-size: 0.8em;
            color: #aaa;
            flex-shrink: 0;
        }

        /* Pinch zoom hint on mobile */
        .hint {
            position: absolute;
            top: 12px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0,0,0,0.6);
            padding: 4px 12px;
            border-radius: 20px;
            font-size: 0.75em;
            opacity: 0.7;
            display: none;
        }
        @media (max-width: 599px) {
            .hint { display: block; }
        }
    </style>
</head>
<body>
    <header>
        <h1>🚦 Ohio DOT Traffic Camera</h1>
        <p>US-22 / SR-7 / SR-213 • Quad View (Steubenville)</p>
    </header>
    <div class="camera-container">
        <img id="camera" src="https://itscameras.dot.state.oh.us/images/D11/US-22_SR-7_SR-213_Quad.jpg" alt="Live Quad Camera">
        
        <div class="overlay">
            📍 40.3871, -80.6348
        </div>
        <div class="timestamp" id="timestamp"></div>
        <div class="hint">👆 Pinch to zoom</div>
    </div>
    
    <footer>
        Auto-refreshes every 5s • Ohio Department of Transportation
    </footer>

    <script>
        const img = document.getElementById('camera');
        const timestampEl = document.getElementById('timestamp');

        function updateImage() {
            const timestamp = Date.now();
            img.src = `https://itscameras.dot.state.oh.us/images/D11/US-22_SR-7_SR-213_Quad.jpg?t=${timestamp}`;
            
            const now = new Date();
            timestampEl.textContent = now.toLocaleTimeString('en-US', {
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
        }

        updateImage();
        setInterval(updateImage, 5000);

        // Manual refresh
        document.addEventListener('keydown', e => {
            if (e.key.toLowerCase() === 'r') updateImage();
        });

        // Double tap to refresh on mobile
        let lastTap = 0;
        img.addEventListener('touchend', () => {
            const currentTime = new Date().getTime();
            const tapLength = currentTime - lastTap;
            if (tapLength < 500 && tapLength > 0) {
                updateImage();
            }
            lastTap = currentTime;
        });
    </script>
</body>
</html>
